general:
  mode: train
  runner: diego
  device: cpu

dataset:
  signal_path: tests/data/signal_test.h5
  background_path: tests/data/background_test.h5
  persistent_workers: True
  train:
    num_workers: 2
    batch_size: 1000 # You should use the same batch size that used for training, when predicting/testing.
  val:
    num_workers: 2
    batch_size: 1000

model:
  type: Transformer
  input_dim: 8
  n_heads: 1
  n_layers: 1
  n_particles: 5

train:
  n_epochs: 2
  learning_rate: 0.0003
  dropout_probability: 0.1
predict:
  model_ckpt_path: lightning_logs/version_1/checkpoints/
  output_file: predictions.csv
performance:
  model_ckpt_path: lightning_logs/version_1/checkpoints/