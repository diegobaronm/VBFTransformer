general:
  mode: train
  runner: diego
  device: cpu

dataset:
  signal_path: tests/data/signal_test.h5
  background_path: tests/data/background_test.h5
  persistent_workers: True
  train:
    num_workers: 8
    batch_size: 1000
  val:
    num_workers: 4
    batch_size: 1000

model:
  n_particles: 7
  n_features: 63

train:
  n_epochs: 3
  learning_rate: 0.002
  dropout_probability: 0.1
predict:
  output_file: predictions.csv

performance:
  model_ckpt_path: lightning_logs/version_0/checkpoints/