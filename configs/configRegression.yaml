dataset:
  input_files:
  - ../../H5Dumper/VBF_Ztautau_Sherpa2211_700360_mc20a_fullsim.h5
  - ../../H5Dumper/VBF_Ztautau_Sherpa2211_700360_mc20d_fullsim.h5
  - ../../H5Dumper/VBF_Ztautau_Sherpa2211_700360_mc20e_fullsim.h5
  - ../../H5Dumper/VBF_Ztautau_PoPy_600939_mc20a_fullsim.h5
  - ../../H5Dumper/VBF_Ztautau_PoPy_600939_mc20d_fullsim.h5
  - ../../H5Dumper/VBF_Ztautau_PoPy_600939_mc20e_fullsim.h5
  
  scaling_dict:
    energy: logminmax
    eta: standardscaler
    pt: logminmax
  extra_scaling_dict:
    lep_met_angle_signed: standardscaler
    opening_angle: minmax
    mz_reco: logminmax
  target_scaling: none
    
  
  train:
    num_workers: 10
    batch_size: 2048
  val:
    num_workers: 10
    batch_size: 1024

  inverse_sampling: False
  KDE_width: 2
  Min_Dens_cap: 30

  
model:
  layers: [128, 128]
  n_particles: 5
  name: configRegression
  type: DNNRegression
  
train:
  dropout_probability: 0.0
  early_stopping_patience: 10
  learning_rate: 0.00015
  loss_fn: InverseGaussianWeightedLoss
  loss_fn_params:
    base_loss: SmoothL1Loss
    base_loss_params:
      beta: 10.0
      reduction: mean
    center: 91.8
    max_weight: 2.5
    sigma: 1.5
  lr_scheduler_patience: 6
  n_epochs: 500
  num_quantiles: 10
  weight_decay: 0.0
  
performance:
  model_ckpt_path: lightning_logs/version_0/checkpoints/
predict:
  model_ckpt_path: lightning_logs/version_0/checkpoints/
  output_file: predictions.csv
general:
  device: cuda
  mode: performance
  runner: federico
